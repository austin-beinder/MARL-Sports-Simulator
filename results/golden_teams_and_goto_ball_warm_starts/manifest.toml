# Usage:
#   - 2026-11-27: Wrote this manifest: Task 16's Series 1, keep-away at five
#     team sizes with kicking, from scratch vs warm-started from a goto_target
#     actor, plus a no-kick 2v1 arm (backlog task 16). Per arm: learning
#     curves, final results, training diagnostics; per team size: the arms
#     together (curves + final); per start condition: the five team sizes'
#     learning curves together (no baselines); one table section per arm; the
#     goto_target warm-up's own curve and diagnostics.
# ==============================================================================
# PyBullet keep-away, red 1.8 m/s, start_mix 0.5, seeds 0-4 x 1M steps, eval 50 fixed episodes every 10 iterations.
# Arms (runs/task16/, made by scripts/queue_runs.py from runs/task16/queue.txt):
#   scratch          keepaway_kick_<NvM>       rl.kick_enabled = true
#   goto warm start  keepaway_kick_warm_<NvM>  same, --init-from goto_target_kick_pybullet_seed<s>/checkpoints/final.pt
#                                              (200k steps of goto_target 1v0, kick on; new players' columns start at
#                                              zero, rl.new_player_init = "zero": curriculum stage 1's recipe)
#   no kick          keepaway_nokick_2v1       2v1, kicking off, from scratch
# Team sizes play different games, each with its own scripted baselines (gray), so only the two "all team sizes"
# figures mix sizes, and they draw no baselines.
# Caveat for the warm arms: the "untrained" baseline is a FRESH network, not the warm start; the warm start's
# own "before" is step 0 of its learning curve.
# Render:  python scripts/plot.py --manifest results/golden_teams_and_goto_ball_warm_starts/manifest.toml
# Freeze:  python scripts/freeze.py golden_teams_and_goto_ball_warm_starts

