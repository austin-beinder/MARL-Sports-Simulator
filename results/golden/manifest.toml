name        = "golden"
description = "Midterm mock-env results (keep-away 1v1 survival + PBRS ablation, goto_target, calibration)"

# --- Keep-away 1v1: survival-only reward, seeds 0-4, 1M steps ---------------------------
[[figure]]
kind      = "curves"
name      = "keepaway_learning_curves"
title     = "Keep-away 1v1: survival on the fixed evaluation episodes during training"
baselines = "survival only"
ylim      = [50, 175]
  [[figure.arm]]
  label = "survival only"
  runs  = "data/Old_mock_env/keepaway_1v1_seed*"

[[figure]]
kind      = "final"
name      = "keepaway_final_results"
title     = "Keep-away 1v1: final evaluation (same fixed episodes for every policy)"
baselines = "survival only"
  [[figure.arm]]
  label = "survival only"
  runs  = "data/Old_mock_env/keepaway_1v1_seed*"

[[figure]]
kind  = "diagnostics"
name  = "keepaway_training_diagnostics"
title = "Keep-away PPO training diagnostics"
  [[figure.arm]]
  label = "survival only"
  runs  = "data/Old_mock_env/keepaway_1v1_seed*"

# --- PBRS ablation: + potential-based acquisition shaping (coef 4), seeds 0-4 -----------
[[figure]]
kind      = "curves"
name      = "pbrs_learning_curves"
title     = "Keep-away 1v1: survival-only vs + PBRS acquisition shaping (coef 4), fixed evaluation episodes"
baselines = "survival only"
ylim      = [50, 175]
  [[figure.arm]]
  label = "survival only"
  runs  = "data/Old_mock_env/keepaway_1v1_seed*"
  [[figure.arm]]
  label = "+ PBRS (coef 4)"
  runs  = "data/Old_mock_env/keepaway_1v1_pbrs_seed*"

# --- PBRS coefficient pilot (~200k steps; coef 0 = the survival runs at iter 100) -------
[[figure]]
kind      = "sweep"
name      = "pbrs_coef_sweep"
title     = "PBRS coefficient pilot (~200k steps each): stronger shaping speeds the approach but doesn't win races"
x_label   = "PBRS coefficient"
highlight = 4
  [[figure.point]]
  x     = 0
  label = "0 (survival only)"
  table = "data/Old_mock_env/eval_keepaway_1v1_seed0_iter_00100_per_run.csv"
  [[figure.point]]
  x     = 1
  table = "data/Old_mock_env/eval_pilot_pbrs_coef1_seed10_per_run.csv"
  [[figure.point]]
  x     = 2
  table = "data/Old_mock_env/eval_pilot_pbrs_coef2_seed10_per_run.csv"
  [[figure.point]]
  x     = 4
  table = "data/Old_mock_env/eval_pilot_pbrs_coef4_seed10_per_run.csv"
  [[figure.point]]
  x     = 8
  table = "data/Old_mock_env/eval_pilot_pbrs_coef8_seed10_per_run.csv"
  [[figure.point]]
  x     = 16
  table = "data/Old_mock_env/eval_pilot_pbrs_coef16_seed10_per_run.csv"

# --- goto_target sanity check, seeds 0-2 -------------------------------------------------
[[figure]]
kind      = "goto"
name      = "goto_target_curve"
baselines = "goto_target PPO"
  [[figure.arm]]
  label = "goto_target PPO"
  runs  = "data/Old_mock_env/goto_target_seed*"

# --- Red-speed calibration (scripted policies only) --------------------------------------
[[figure]]
kind   = "calibration"
name   = "calibration_red_speed"
csv    = "data/Old_mock_env/calibration_keepaway_1v1.csv"
config = "data/Old_mock_env/keepaway_1v1_seed0/config.json"

# --- Table view (results_tables.md): the original four sections, in order ---------------
[[table]]
title   = "Keep-away ({n_runs} runs; mean episode length, control steps)"
source  = "data/Old_mock_env/eval_keepaway_1v1_seed0.csv"
columns = "keepaway"

[[table]]
title   = "Keep-away + PBRS acquisition shaping, coef 4 ({n_runs} runs; mean episode length, control steps)"
source  = "data/Old_mock_env/eval_keepaway_1v1_pbrs_seed0.csv"
columns = "keepaway"

[[table]]
title   = "PBRS coefficient pilot (PPO, stochastic eval; lengths in control steps)"
sweep   = "pbrs_coef_sweep"
columns = "sweep"
first   = "PBRS coef"

[[table]]
title   = "goto_target ({n_runs} runs; mean reward = minus mean distance, m)"
source  = "data/Old_mock_env/eval_goto_target_seed0.csv"
columns = "goto"

