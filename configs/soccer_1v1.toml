# Soccer 1v1: blue against one red that chases the ball, score in the east goal
# within 30 s. A red goal (only blue own goals, for now: red just chases) is -1,
# a time-out a draw. The "dribble" baseline wins about 65% here.
# PyBullet only. Omitted keys take the defaults in marl/common/config.py.

[shared]
scenario = "soccer"
n_blue = 1
n_red = 1
max_episode_steps = 600  # 30 s at 20 decisions a second

[rl]
horizon_seconds = 10.0  # gamma = 0.995: at 5 s a goal 15 s away is worth ~5%
kick_enabled = true

[rl.reward]
base = "goal"  # +-1 per goal, as the learner sees it
# Both potential-based, so neither changes which policy is best. Starting points, not tuned:
# a full carry from blue's own goal line earns pbrs_ball_to_goal ~20 (raw), a tenth of a goal.
shaping = [
    { name = "pbrs_ball_to_goal", enabled = true, coef = 20.0 },
    { name = "pbrs_ball_acquisition", enabled = true, coef = 2.0 },
]

[run]
total_steps = 1_000_000
