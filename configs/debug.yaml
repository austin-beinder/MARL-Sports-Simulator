# Visual/debug-oriented configuration.
#
# Run:
#   python pybullet/main.py --config configs/debug.yaml

project:
  name: "marl-sports-debug"
  seed: 123

run:
  mode: "demo"

simulation:
  # Opens the PyBullet GUI through KeepAwayEnv.
  gui: true

  # Slow demo execution to approximately match simulated time.
  real_time: true

game:
  name: "keep_away"

  # Same schema as KeepAwayConfig.
  config:
    blue_max_speed: 3.0
    red_max_speed: 2.0
    red_gain: 2.0
    possession_speed_multiplier: 0.75

    red_win_time: 0.3
    blue_win_time: 20.0
    max_game_time: 60.0

    spawn_separation: 2.0
    ball_spawn_fraction: 0.3

    field_length: 21.0
    field_width: 13.6

    action_repeat: 8

demo:
  episodes: 1
  policy: "random"

training:
  algorithm: "ippo"
  entrypoint: null
  total_episodes: 1
  learning_rate: 0.0003
  gamma: 0.99
  hidden_sizes: [128, 128]

model:
  resume_from: null
  checkpoint_every_episodes: 1

logging:
  output_dir: "outputs"

debug:
  camera:
    distance: null
    yaw: 0.0
    pitch: -89.9
    target: [0.0, 0.0, 0.0]

  # Adds simple BLUE/RED text labels that follow the current players.
  draw_labels: true
