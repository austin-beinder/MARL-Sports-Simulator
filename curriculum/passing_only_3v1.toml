### AI GENERATED (2026-11-09: pass practice with the blues free to move)
# catch_moving: the pass_practice_moving scenario. Like catch_far (no red), but every blue can
# move: the holder can dribble before kicking (at carry speed) and the teammates can run to meet
# the ball. Since 2026-11-11 the episode runs the full 15 s with as many passes as the blues make,
# each catch pays 1 when it happens (pass_catch), and the gate is on passes / kicks. The movement
# head trains again here (it was masked in the frozen stages); the critic starts fresh (a
# different scenario).
[[stage]]
name = "catch_moving"
total_steps = 400_000
threshold = 0.9
confidence = 2.0
window = 50
stop_when_passed = true
[stage.overrides.shared]
scenario = "pass_practice_moving"
n_blue = 3
n_red = 0
[stage.overrides.shared.start]
pass_distance = 3.9
[stage.overrides.rl.reward]
base = "pass_catch"         # 2026-11-11: per catch, over the full 15 s
### END AI GENERATED

### AI GENERATED (2026-11-10: catch_moving with real passes only)
# catch_moving_long: catch_moving again with two reward options on. A catch less than 1 m from
# the kick point is no pass (it pays nothing, and doesn't count for the gate), and teammates
# within 1.5 m of the kick point earn no near-miss credit, so tapping the ball into a teammate
# who ran up next to the kicker stops paying. A real catch pays 0.75 + 0.25 * min(1, length / 4 m),
# so longer passes pay a bit more and every catch still beats every miss (at most 0.5).
# catch_moving trains first on the plain reward (any catch pays 1), which it learns quickly. The
# critic starts fresh here (the reward changed).
[[stage]]
name = "catch_moving_long"
total_steps = 1_000_000
threshold = 0.9
confidence = 2.0
window = 50
stop_when_passed = true
[stage.overrides.shared]
scenario = "pass_practice_moving"
n_blue = 3
n_red = 0
[stage.overrides.shared.start]
pass_distance = 3.9
[stage.overrides.rl.reward]
base = "pass_catch"
min_pass_distance = 1.0     # m from the kick point
pass_length_bonus = true    # 0.75 to 1 by the pass's length (full from 4 m)
### END AI GENERATED


