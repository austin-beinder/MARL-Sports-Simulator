# one kick per episode, which ends as soon as the kick plays out (a blue has the ball again, or
# it stops). Reward (pass_practice, paid once at the end): 1 if a teammate catches it, else
# 0.5 * exp(-gap / 1 m) for how close the ball came to a teammate, 0 for no kick. (2026-11-10:
# rl.reward.min_pass_distance and pass_length_bonus can add a minimum pass and pay a catch by its
# length; these stages leave them off.) The gate is on
# the catch rate (not survival). Each teammate stands pass_distance (+-15%) from the holder, so
# the passes get longer stage by stage; a full kick rolls ~4.9 m, and catch_far's longest pass is
# 3.9 * 1.15 = 4.5 m. The critic carries between these three (same scenario and reward).
