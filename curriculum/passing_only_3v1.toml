# Date:    2026-11-08
# Author:  Austin Beinder
# Usage:
#   - 2026-11-08: Created this file: a 3v1 passing curriculum. A goto_target
#     warm-up, then a passing drill (frozen blues) against a red that gets
#     faster stage by stage, then normal 3v1 keep-away.
#   - 2026-11-08: The hold reward now grows with each catch (header comment).
#   - 2026-11-09: Three pass_practice stages (catch_close, catch_mid,
#     catch_far) after free_ball: one kick to a frozen teammate, no red, the
#     teammates further away each stage.
#   - 2026-11-09: catch_moving after catch_far: the same pass practice with the
#     blues free to move (pass_practice_moving).
#   - 2026-11-10: catch_moving_long after catch_moving: the same, but a pass
#     has to go 1 m and longer catches pay a bit more.
#   - 2026-11-11: The moving stages run the full 15 s with as many passes as
#     the blues make; each catch pays when it happens (pass_catch).
# Prompt summary: A 3v1 passing drill against a slow red with the blues frozen
#   in range of each other: a small reward for kicking toward a teammate, a big
#   one for lasting, nothing before the first pass; in a new curriculum TOML.
# Human review:   Pending review
# ==============================================================================
# Monkey in the middle, 3v1. The goal is blues that keep the ball away from red by passing round
# it, not by running. (See the docstring in runner.py for how stages and gates work.)
#   1. go_to_target: no red; the ball is a fixed target and the reward is minus the distance to
#      it. Teaches movement, which the drill doesn't use but the last stage does.
#   free_ball, then catch_close / catch_mid / catch_far (2026-11-09): pass practice, one kick
#      to a frozen teammate with no red, the teammates 1.5, 2.75 and 3.9 m away (see the stages).
#   catch_moving (2026-11-09): the same at 3.9 m, but the blues can move (see the stage).
#   catch_moving_long (2026-11-10): catch_moving again, but short passes don't count (see the stage).
#   2-4. drill_*: the passing_drill scenario. The three blues are frozen on a circle (~2 m
#      radius, so passes of about 3-4 m) round red, and one of them starts with the ball. Their
#      move actions are ignored and masked out of PPO, so passing is the only way to keep the
#      ball, and the movement skill from stage 1 is left alone. Red gets faster each stage:
#      0.6, then 1.2, then 1.8 m/s (full speed). Each stage moves on once its gate passes.
#      The drill's own reward (marl/rl/reward.py) replaces survival in these stages only:
#        - passing_drill (base): each step a blue holds the ball pays the number of passes
#          completed so far (1 after the first catch, 2 after the second, ...). The opening
#          hold and a loose ball earn nothing.
#        - pass_progress (coef 1): per metre the ball gets closer to the nearest other blue
#          while a kick is in play (negative if it rolls away).
#        - pass_completed (coef 3): once per pass, when a different blue picks it up.
#   5. keepaway_3v1: normal keep-away with the survival reward, everyone free to move. Blue is
#      slower than red all the time (as in keepaway_1v1's slow_two_v_one: 1.75 m/s without the
#      ball, 1.5 m/s with it, against red's 1.8), so running away doesn't work and passing has
#      to carry over. The critic starts fresh here (different scenario and reward).
#
# The thresholds and shaping coefs are guesses. A pass of ~3 m with a full kick takes ~1.2 s, in
# which red covers 0.7 m at 0.6 m/s but 2.2 m at 1.8 m/s, so the full-speed drill may never pass
# its gate; it then trains to its step cap and moves on. Check train.csv's gate_mean / gate_lower.

name = "passing_3v1"
config = "configs/keepaway_1v1.toml"  # the base experiment config (repo-relative); stages override it
env = "pybullet"                      # PyBullet only: the mock can't kick

[overrides.rl]
kick_enabled = true

[[stage]]
name = "go_to_target"
total_steps = 200_000     # no threshold = no gate: always runs this many steps
[stage.overrides.shared]
scenario = "goto_target"
n_red = 0
[stage.overrides.rl.reward]
base = "goto_target"

[[stage]]
name = "free_ball"
total_steps = 1_500_000
option = "max_ball_dist"
levels = [1.0, 2.0, 3.0]  # metres from blue
threshold = 0.5          # lower than possession: blue has to get to the ball before red does
confidence = 2.0
window = 50
stop_when_passed = true   # move on to 2v1 once it passes at 3 m (or at the step cap)

[stage.overrides.shared.start]
start_mix = 0.0           # every episode starts with a loose ball
max_ball_dist = 3.0       # the stage's real task, which eval.csv measures: the ball within 3 m

### AI GENERATED (2026-11-09: pass practice, three distances)
