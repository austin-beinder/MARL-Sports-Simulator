# Monkey in the middle, 3v1: blues that keep the ball away from red by passing round it, not by
# running. (See the docstring in runner.py for how stages and gates work.) Kicking is on in every
# stage, so this needs PyBullet.
#   1. go_to_target: movement warm-up. No red; the ball is a fixed target and the reward is minus
#      the distance to it.
#   1b. claim_ball (2026-11-14): three blues, no red, a loose ball anywhere; the episode ends when
#      a blue picks it up, and every step until then costs 1. Practice for the "got it" call: a
#      blue's call pays it +1 a step if it gets the ball within 0.5 s, -0.5 if a teammate does, and
#      blues that crowd a ball a teammate called pay for it (call_yield).
#   2. free_ball: 1v1 keep-away from a loose ball, which starts 1, 2, then 3 m from blue.
#   3. catch_moving: pass practice with no red and everyone free to move, for the full 15 s. Each
#      catch by a teammate pays 1 if the ball went at least 2 m; the blues are also paid for
#      standing 3 m apart.
#   4-5. catch_moving_longer / _longest: the same, but longer catches pay a bit more, and the
#      last stage needs 3 m passes (blues 4 m apart).
#      Stages 3-5 also charge the kicker for staying near its own kick (kicker_clearance), charge
#      every step the ball sits stopped and loose (dead_ball) and crowding a called ball
#      (call_yield), and gate on the share of kicks caught.
#   6. keepaway_from_catch: 3v1 keep-away that starts in the catch layout (a blue with the ball,
#      teammates 3.9 m away, red at least 3 m off), then less and less often (all, half, none),
#      the rest from random positions with a blue holding the ball.
#   7. go_to_target_again: a short goto_target refresher (30k steps).
#   8. keepaway_3v1: normal 3v1 keep-away with the survival reward, starting from a loose ball
#      1, 2, then 3 m from a blue. Blue is slower than red even without the ball (1.75 m/s, 1.5
#      with it, against red's 1.8), so running away doesn't work and passing has to carry over.
# The critic starts fresh at every stage from 3 on: each one changes the scenario or the reward,
# and it only carries over when both match. The actor always carries over.
#
# The thresholds are guesses. Check train.csv's gate_mean / gate_lower (and cur_level in the
# stages with levels) to see how close a stage came to its gate.

name = "passing_3v1"
config = "configs/keepaway_1v1.toml"  # the base experiment config (repo-relative); stages override it
env = "pybullet"                      # PyBullet only: the mock can't kick

[overrides.rl]
kick_enabled = true
### AI GENERATED (2026-11-12)
# Every warm start here that adds players (go_to_target 1v0 -> the catch stages' 3v0, the catch
# stages -> 3v1) starts the new players' input columns at random instead of zero. With zero, the
# blues in catch_moving still barely saw each other after 180k steps (teammate columns ~6x weaker
# than the ball's) and bunched 0.5 m apart even when spacing was nearly the whole reward; a
# from-scratch network on the same task kept them ~2.6 m apart.
new_player_init = "random"
### END AI GENERATED
### AI GENERATED (2026-11-13)
# Each blue sees which blue passed the ball to its holder (s["ball"]["passer"]), so the holder
# can tell a pass back from a pass on (return_pass_factor in the catch stages pays them
# differently). A warm start from a checkpoint without it adds the flags' columns at random.
passer_obs = true
# A "got it" call each blue can raise, which its teammates see; in every stage so the observation
# layout stays the same. The catch stages pay for calls that come true (call_accuracy).
# 2026-11-14: call_accuracy pays each blue for its own calls, to the call head only (the team
# reward never sees it); its coef weights that against the team's PPO loss (1 = as much).
call_enabled = true
### END AI GENERATED

[[stage]]
name = "go_to_target"
total_steps = 200_000     # no threshold = no gate: always runs this many steps
[stage.overrides.shared]
scenario = "goto_target"
n_red = 0
[stage.overrides.rl.reward]
base = "goto_target"

### AI GENERATED (2026-11-14: practice for the "got it" call)
# claim_ball: three blues and a loose ball anywhere on the field, no red. The episode ends as
# soon as a blue picks the ball up (or after 15 s); every step before that costs 1 (base claim),
# so the team wants the ball fast.
#   - call_accuracy (coef 1): each blue's call is scored on its own (the call head's own reward,
#     not the team's): +1 a step for calling in the 0.5 s before it gets the ball, -0.5 a step for
#     calling in the 0.5 s before a teammate gets it, and 0.02 a step for calling at all. So the
#     blue who'll get there first should call, and nobody else.
#   - call_yield (coef 0.2): while a teammate is calling, a blue that isn't pays up to 0.2 a step
#     for being within 1.5 m of the ball, and 2 for picking it up. So a call means "leave it to
#     me". It is cheaper than a slow pickup (1 a step), so blues still go for a ball nobody calls.
# In catch_moving a stopped loose ball sat a median 8 s with the nearest blues hanging back, and
# after 4M steps of calls paid through the team reward, the getter called less than its teammates.
# Warm-started from go_to_target (1v0): the two new blues' input columns start random.
[[stage]]
name = "claim_ball"
total_steps = 500_000     # no gate
[stage.overrides.shared]
scenario = "claim_ball"
n_blue = 3
n_red = 0
[stage.overrides.rl.reward]
base = "claim"
shaping = [{ name = "call_accuracy", enabled = true, coef = 1.0 },
           { name = "call_yield", enabled = true, coef = 0.2 }]
### END AI GENERATED

