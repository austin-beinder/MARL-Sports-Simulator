### AI GENERATED (2026-11-09: pass practice with the blues free to move; 2026-11-11: to the time limit)
# catch_moving: the pass_practice_moving scenario. Three blues, no red; one starts with the ball
# and every blue can move (the holder at carry speed). Each teammate starts 3.9 m (+-15%) from the
# holder. Since 2026-11-11 the episode runs the full 15 s (300 steps), with as many passes as
# the blues can make; after a miss somebody has to fetch the loose ball.
#   - Reward (pass_catch): each catch by a teammate pays 1 on the step it happens, if the ball
#     went at least 2 m from where it was kicked (min_pass_distance, 2026-11-11). With no
#     minimum the blues learned to huddle 0.5 m apart and tap the ball back and forth (38
#     "passes" a game, median 0.5 m). 3 m spacing gives ~2.2 m passes, enough to count. The
#     receiver must also have stood 2 m from the kick point at the kick (2026-11-11): otherwise
#     the blues run as a pack, kick the ball a few metres ahead and let a packmate chase it down.
#   - kicker_clearance (coef 0.025): while its kick is in play the kicker pays 0.025 * (1 - d / 1.5 m)
#     a step for being within 1.5 m of the ball (d = distance), and 0.25 for taking it back. So it
#     kicks firmly and leaves the ball to its teammates instead of chasing it.
#   - receiver_spacing (coef 0.03, 2026-11-11): every step, up to 0.03 for every pair of blues
#     being rl.reward.spacing_distance (3 m) apart: a tent, 0 at 0 m, 1 at 3 m, 0 again at 6 m, so
#     each metre apart is worth 0.01 a step wherever the blues start. So the blues spread out into
#     passing range and the one best placed for the next pass is ready for it. A whole episode of
#     perfect spacing is worth 9, less than a good passing episode. (With 0.01 and a 1 m wide
#     Gaussian bump the blues stayed bunched 0.6 m apart: its tail was flat.)
# The gate is on the pass completion rate: each episode scores passes / kicks (a tap shorter than
# 2 m counts as a missed kick).
# ent_coef 0.01 (2026-11-12, all three catch stages; the default is 0.001): free_ball leaves the
# movement head nearly deterministic (entropy -2.2, "everyone runs to the ball"), and with the
# default the blues never tried standing apart: they stayed a median 0.5 m apart through all
# 500k catch steps, and the catch rate rose only because they stopped kicking.
[[stage]]
name = "catch_moving"
total_steps = 2_000_000   # 2026-11-13: was 1M (2026-11-12: 300k); still climbing at each cap: 5% -> 24% caught by 300k, 84% by 1M
threshold = 0.8
confidence = 2.0
window = 50
stop_when_passed = true
[stage.overrides.shared]
scenario = "pass_practice_moving"
n_blue = 3
n_red = 0
[stage.overrides.shared.start]
pass_distance = 3.9
[stage.overrides.rl.ppo]
ent_coef = 0.01            # 10x the default: see the catch_moving comment (2026-11-12)
[stage.overrides.rl.reward]
base = "pass_catch"
shaping = [{ name = "kicker_clearance", enabled = true, coef = 0.025 },
           { name = "receiver_spacing", enabled = true, coef = 0.03 }]  # see the catch_moving comment
min_pass_distance = 2.0     # m from the kick point (2026-11-11)
### END AI GENERATED

### AI GENERATED (2026-11-10: catch_moving with real passes only; 2026-11-11: 2 then 3 m)
# catch_moving_longer / _longest: catch_moving again with two reward options on.
#   - min_pass_distance d (2, then 3 m): a catch less than d from the kick point is no pass (it
#     pays nothing and counts as a missed kick for the gate). So receivers can't just run up to
#     the holder: they have to take the ball further out.
#   - pass_length_bonus: a catch pays 0.75 + 0.25 * min(1, length / 4 m), so longer passes pay a
#     bit more.
# (A 1 m stage, catch_moving_long, came first until 2026-11-11; catch_moving now needs 2 m.)
# A pass between blues d apart travels about d - 0.8 m (the ball sits at the kicker's edge and is
# caught at the receiver's), so 3 m spacing gives ~2.2 m passes. The 3 m stage spaces the blues
# 4 m apart (spacing_distance) so its passes can make the minimum (2026-11-11). The critic starts
# fresh in each (the reward changes every stage).
[[stage]]
name = "catch_moving_longer"
total_steps = 500_000     # 2026-11-13: was 100k; 73% caught at the cap
threshold = 0.9
confidence = 2.0
window = 50
stop_when_passed = true
[stage.overrides.shared]
scenario = "pass_practice_moving"
n_blue = 3
n_red = 0
[stage.overrides.shared.start]
pass_distance = 3.9
[stage.overrides.rl.ppo]
ent_coef = 0.01            # 10x the default: see the catch_moving comment (2026-11-12)
[stage.overrides.rl.reward]
base = "pass_catch"
shaping = [{ name = "kicker_clearance", enabled = true, coef = 0.025 },
           { name = "receiver_spacing", enabled = true, coef = 0.03 }]  # see the catch_moving comment
min_pass_distance = 2.0     # m from the kick point
pass_length_bonus = true

[[stage]]
name = "catch_moving_longest"
total_steps = 500_000     # 2026-11-13: was 100k; the catch rate went 5% -> 46% in 100k, still rising
threshold = 0.9
confidence = 2.0
window = 50
stop_when_passed = true
[stage.overrides.shared]
scenario = "pass_practice_moving"
n_blue = 3
n_red = 0
[stage.overrides.shared.start]
pass_distance = 3.9
[stage.overrides.rl.ppo]
ent_coef = 0.01            # 10x the default: see the catch_moving comment (2026-11-12)
[stage.overrides.rl.reward]
base = "pass_catch"
shaping = [{ name = "kicker_clearance", enabled = true, coef = 0.025 },
           { name = "receiver_spacing", enabled = true, coef = 0.03 }]  # see the catch_moving comment
min_pass_distance = 3.0     # m from the kick point
pass_length_bonus = true
spacing_distance = 4.0      # m apart, so a pass makes ~3.2 m (2026-11-11)
### END AI GENERATED

### AI GENERATED (2026-11-11: red joins the catch layout)
# keepaway_from_catch: catch_moving with a red added. Normal 3v1 keep-away (survival reward, 15 s
# episodes, blue slower than red), but resets start like the catch stages: a blue holding the
# ball, the other two about 3.9 m from it, and red anywhere at least 3 m from the ball.
# catch_start_mix is the share of resets that start that way; the levels step it from 1 to 0.5 to
# 0 as the survival gate passes. The other resets have a random blue holding the ball with
# everyone placed at random (start_mix = 1). eval.csv measures the last level: random positions.
# No kicker_clearance: the survival reward takes over, as in keepaway_3v1.
[[stage]]
name = "keepaway_from_catch"
total_steps = 500_000
threshold = 0.5           # survival fraction (of 300 steps) the gate's lower bound must reach
option = "catch_start_mix"
levels = [1.0, 0.5, 0.0]  # share of resets in the catch layout
confidence = 2.0
window = 50
stop_when_passed = true
[stage.overrides.shared]
n_blue = 3
free_speed_factor = 0.875 # 1.75 m/s without the ball, under red's 1.8
[stage.overrides.shared.start]
pass_distance = 3.9       # as in the catch stages
start_mix = 1.0           # the other resets: a blue holds the ball too, everyone at random
catch_start_mix = 0.0     # the stage's real task, which eval.csv measures
### END AI GENERATED

