# Usage:
#   - 2026-10-10: Created this file: pytest settings only (test paths and
#     import root), so `pytest` works from the repo root.
#   - 2026-11-25: Added the pylint settings ([tool.pylint.*]): import path and
#     PyBullet support, and the checks turned off by the team's decision.
# Prompt summary: Implement Phase 3 of the issue #7 plan (RL layer + mock env).
# Human review:   Pending review
# ==============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

# pylint (a dev tool; not in requirements.in). Run from the repo root:
#   python -m pylint $(git ls-files '*.py')
# The VS Code pylint extension reads these settings too.
[tool.pylint.main]
# PyBullet is compiled C, so pylint must import it to see its functions.
extension-pkg-allow-list = ["pybullet"]
# pybulletGame/ imports its modules by bare name (`from entity import Entity`), as its
# unittest command does. Path is relative to the repo root.
init-hook = "import sys; sys.path.insert(0, 'pybulletGame')"
jobs = 0

[tool.pylint.basic]
# Single capital letters are standard math notation here (T timesteps, N agents, ...).
good-names-rgxs = ["^[A-Z]$"]

[tool.pylint.classes]
# Gym-style envs set their state up in reset(), not only in __init__.
defining-attr-methods = ["__init__", "__new__", "setUp", "asyncSetUp", "__post_init__", "reset"]

[tool.pylint."messages control"]
disable = [
  # Line width: left to a formatter (e.g. Black) later.
  "line-too-long",
  # Docstrings only where they need explaining (AGENTS.md). missing-module-docstring stays on.
  "missing-function-docstring", "missing-class-docstring",
  # Complexity / class-design limits: not a goal for now.
  "too-many-arguments", "too-many-positional-arguments", "too-many-locals",
  "too-many-instance-attributes", "too-many-branches", "too-many-statements",
  "too-many-return-statements", "too-many-nested-blocks", "too-many-boolean-expressions",
  "too-many-public-methods", "too-many-ancestors", "too-many-lines", "too-few-public-methods",
  # pytest patterns: fixtures shadow outer names; tests look at private members.
  "redefined-outer-name", "protected-access",
]
